<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع مغلق حالياً | Site Closed</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #DFBA73 0%, #C5A059 50%, #9E7D3B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow {
            box-shadow: 0 0 50px -10px rgba(197, 160, 89, 0.15);
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex items-center justify-center p-4 selection:bg-[#C5A059] selection:text-black">
    <div class="max-w-lg w-full text-center space-y-8 p-8 md:p-12 rounded-3xl bg-neutral-900/80 border border-neutral-800 glow backdrop-blur-xl shadow-2xl relative overflow-hidden">
        
        <!-- Decorative subtle background circle -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-[#C5A059]/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-[#C5A059]/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Lock / Maintenance Icon -->
        <div class="relative inline-flex items-center justify-center w-24 h-24 rounded-2xl bg-neutral-800/80 border border-neutral-700/60 shadow-inner">
            <i class="fa-solid fa-lock text-4xl text-[#C5A059]"></i>
            <span class="absolute -top-1 -right-1 flex h-4 w-4">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#C5A059] opacity-75"></span>
                <span class="relative inline-flex rounded-full h-4 w-4 bg-[#C5A059]"></span>
            </span>
        </div>

        <!-- Headings -->
        <div class="space-y-3">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold tracking-wide bg-amber-500/10 text-amber-400 border border-amber-500/20">
                تحت الصيانة والإيقاف المؤقت
            </span>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">
                الموقع مغلق حالياً
            </h1>
            <p class="text-neutral-400 text-sm md:text-base leading-relaxed">
                نعتذر لزوارنا الكرام، الموقع متوقف حالياً لأعمال التحديث والصيانة الدورية وسنعود للعمل قريباً.
            </p>
        </div>

        <!-- Divider -->
        <div class="h-px w-full bg-gradient-to-r from-transparent via-neutral-800 to-transparent"></div>

        <!-- English Notice -->
        <div class="space-y-1 text-xs md:text-sm text-neutral-500" dir="ltr">
            <p class="font-medium text-neutral-400">Website Under Maintenance</p>
            <p>We are currently closed for scheduled maintenance. Please check back later.</p>
        </div>

        <!-- Footer info -->
        <div class="pt-2 text-xs text-neutral-600">
            &copy; 2026 جميع الحقوق محفوظة
        </div>
    </div>
</body>
</html>
